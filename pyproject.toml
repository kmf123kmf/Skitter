[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skitter"
version = "0.1.0"
description = "Photo mosaic generator with an animated graphical interface"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "Pillow>=10.0",
    "PySide6>=6.6",
    "moderngl>=5.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.gui-scripts]
skitter = "skitter.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skitter = ["resources/*", "resources/shaders/*.glsl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
