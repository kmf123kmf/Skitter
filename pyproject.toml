[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skitter"
version = "0.1.0"
description = "Photo mosaic generator with an animated graphical interface"
readme = "README.md"
license = "GPL-3.0-or-later"  # the wheels of av and pillow-heif bundle GPL code: THIRD_PARTY_NOTICES.md
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
# Capped until faiss-cpu publishes wheels for newer Pythons.
requires-python = ">=3.11,<3.15"
dependencies = [
    "numpy>=1.26",
    "Pillow>=11.3",  # AVIF built in
    "pillow-heif>=1.0",  # HEIC / HEIF photos (iPhone)
    "pillow-jxl-plugin>=1.3",  # JPEG XL photos
    "av>=14",  # video export (PyAV: FFmpeg with x264, x265, VP9, AV1, ProRes, WebP, GIF)
    "PySide6>=6.6",
    "moderngl>=5.10",
    "faiss-cpu>=1.8",
    "numba>=0.60",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "pyinstaller>=6.10",  # standalone builds: skitter.spec
]

[project.gui-scripts]
skitter = "skitter.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skitter = ["resources/*", "resources/shaders/*.glsl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# For editors that run Pylint: let it import compiled extensions to see their names.
[tool.pylint.main]
extension-pkg-allow-list = ["PySide6", "moderngl", "faiss", "numba"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
